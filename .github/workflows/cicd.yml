name: DevOps CI/CD Pipeline
on:
  push:
    branches: [ "main" ]
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Build Docker Image
        run: docker build -t devops-lab-app:${{ github.sha }} ./app
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
      - name: Create dummy kubeconfig
        run: |
          mkdir -p ~/.kube
          cat > ~/.kube/config << 'KCFG'
          apiVersion: v1
          kind: Config
          clusters:
          - cluster:
              server: https://localhost:6443
              insecure-skip-tls-verify: true
            name: dummy
          contexts:
          - context:
              cluster: dummy
              user: dummy
            name: dummy
          current-context: dummy
          users:
          - name: dummy
            user: {}
          KCFG
      - name: Validate Kubernetes Manifests
        run: |
          kubectl apply --dry-run=client --validate=false -f k8s/deployment.yml
          kubectl apply --dry-run=client --validate=false -f k8s/service.yml
