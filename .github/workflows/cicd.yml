name: DevOps CI/CD Pipeline
on:
  push:
    branches: [ "main" ]
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Build Docker Image
        run: docker build -t devops-lab-app:${{ github.sha }} ./app
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
      - name: Validate Kubernetes Manifests (YAML syntax)
        run: |
          python3 -c "import yaml; list(yaml.safe_load_all(open('k8s/deployment.yml'))); print('deployment.yml: valid YAML')"
          python3 -c "import yaml; list(yaml.safe_load_all(open('k8s/service.yml'))); print('service.yml: valid YAML')"
